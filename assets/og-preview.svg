  <!-- Deep Obsidian Void Canvas -->
  <rect width="1200" height="630" fill="#030305" />

  <!-- Subtle Monolith Grid Matrix -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="4 4">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="360" y1="0" x2="360" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="480" x2="1200" y2="480" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="1050" cy="180" r="280" fill="#FF623E" fill-opacity="0.08" />
  <circle cx="200" cy="500" r="220" fill="#F3B17A" fill-opacity="0.05" />

  <!-- Monolith Status Bar -->
  <g transform="translate(80, 75)">
