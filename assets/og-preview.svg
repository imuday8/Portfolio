  <text x="80" y="608" class="mono-text" font-size="12" fill="#646A7A">OBSIDIAN MONOLITH // UDAY SAHA PORTFOLIO 3.0</text>
  <text x="1120" y="608" class="mono-text" font-size="12" fill="#FF623E" text-anchor="end">us8.dev@gmail.com</text>
