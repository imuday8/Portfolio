      .display-title { font-family: 'Space Grotesk', -apple-system, sans-serif; }
      .sans-text { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
      .mono-text { font-family: 'JetBrains Mono', monospace; }
    </style>
