    <text x="270" y="32" class="mono-text" font-size="11" font-weight="700" fill="#FF623E" text-anchor="end">@Imuday08_</text>
    <text x="20" y="75" class="mono-text" font-size="34" font-weight="700" fill="#FF623E">1016</text>
    <text x="110" y="75" class="mono-text" font-size="14" fill="#646A7A">/ 1045 Max</text>
    <text x="20" y="96" class="sans-text" font-size="12" fill="#646A7A">Contestant Rating</text>
