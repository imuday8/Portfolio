  <!-- Name & Professional Title -->
  <text x="80" y="220" class="display-title" font-size="88" font-weight="800" fill="#F5F3EE" letter-spacing="-2">UDAY SAHA</text>
  <circle cx="620" cy="180" r="8" fill="#FF623E" />
  
  <text x="80" y="270" class="sans-text" font-size="28" font-weight="600" fill="#A4A9B5">Frontend Developer &amp; Computer Science Student</text>
  <text x="80" y="305" class="sans-text" font-size="20" font-weight="500" fill="#646A7A">Newton School of Technology / Rishihood University, Delhi NCR</text>

  <!-- Tagline Quote Block -->
