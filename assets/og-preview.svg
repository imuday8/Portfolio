    <text x="270" y="32" class="mono-text" font-size="11" font-weight="700" fill="#F3B17A" text-anchor="end">@Imuday08__</text>
    <text x="20" y="75" class="mono-text" font-size="34" font-weight="700" fill="#F3B17A">450+</text>
    <text x="120" y="75" class="mono-text" font-size="14" fill="#646A7A">Submissions</text>
    <text x="20" y="96" class="sans-text" font-size="12" fill="#646A7A">102-Day Streak</text>
